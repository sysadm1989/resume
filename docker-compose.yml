services:
  resume:
    build: .
    image: resume-match:latest
    container_name: resume-match
    # Только localhost — снаружи nginx на хосте
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      OPENCODE_BIN: opencode
      OPENCODE_MODEL: ${OPENCODE_MODEL:-opencode/deepseek-v4-flash-free}
      OPENCODE_TIMEOUT_MS: ${OPENCODE_TIMEOUT_MS:-180000}
      MAX_VACANCY_CHARS: ${MAX_VACANCY_CHARS:-80000}
    volumes:
      - ./content:/app/content:ro
      - ./prompts:/app/prompts:ro
      # Креды OpenCode с хоста (обязательно для match)
      - ${OPENCODE_CONFIG_DIR:-${HOME}/.config/opencode}:/root/.config/opencode
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
