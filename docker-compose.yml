services:
  resume:
    image: node:22-bookworm-slim
    container_name: resume-match
    working_dir: /app
    # Только localhost — снаружи nginx на хосте
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      NODE_ENV: production
    volumes:
      - .:/app
      - resume_node_modules:/app/node_modules
    command: ["bash", "scripts/docker-entrypoint.sh"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  resume_node_modules:
