services:
  resume:
    build: .
    image: ${DOCKER_IMAGE:-sysadm1989/resume:latest}
    container_name: resume-match
    # Только localhost — снаружи nginx на хосте
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      NODE_ENV: production
    # Резюме/промпт можно править на хосте без пересборки образа
    volumes:
      - ./content:/app/content:ro
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
